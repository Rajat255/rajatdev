<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Terminal prompt">
  <!--
    Favicon: a terminal prompt (chevron + caret line).

    Glyph path is Font Awesome Free v7.3.1 "terminal" by @fontawesome,
    CC BY 4.0 (https://fontawesome.com/license/free).

    It carries its own dark plate rather than being a bare glyph on transparency:
    a transparent icon inherits whatever the browser chrome is, so the same file
    would vanish against a dark tab strip or a light one depending on the theme.
    The plate also gives Apple's touch icon something to sit on, since iOS
    composites transparent icons onto white.

    Drawn in the site's own gradient (pink primary into orange accent) so the tab
    matches the heading rules and the hero wordmark.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4081" />
      <stop offset="1" stop-color="#FF9F55" />
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="148" fill="#130B23" />

  <!-- Scaled about the centre so the glyph keeps a consistent margin inside the
       plate. The source path's bounding box is already centred on (320, 320). -->
  <g transform="translate(320 320) scale(0.86) translate(-320 -320)" fill="url(#g)">
    <path d="M73.4 182.6C60.9 170.1 60.9 149.8 73.4 137.3C85.9 124.8 106.2 124.8 118.7 137.3L278.7 297.3C291.2 309.8 291.2 330.1 278.7 342.6L118.7 502.6C106.2 515.1 85.9 515.1 73.4 502.6C60.9 490.1 60.9 469.8 73.4 457.3L210.7 320L73.4 182.6z" />
    <path d="M288 448L544 448C561.7 448 576 462.3 576 480C576 497.7 561.7 512 544 512L288 512C270.3 512 256 497.7 256 480C256 462.3 270.3 448 288 448z" />
  </g>
</svg>
